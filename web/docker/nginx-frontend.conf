# [Ref: 04_Phase4/01_成本透视真实数据] 前端 nginx：端口 8080，SPA try_files，/build-info，安全头；/api 代理到 backend
# 使用变量+resolver 使 backend 在请求时解析，避免启动时 compose 网络 DNS 未就绪导致 nginx [emerg] host not found。
# __NGINX_RESOLVER__ 由 entrypoint 从 /etc/resolv.conf 注入：Docker 多为 127.0.0.11，Podman 为网络 nameserver（如 10.89.0.1），
# 无法写死单一 IP 故需启动时注入。若仅用 Docker 可改为写死 resolver 127.0.0.11 并去掉 entrypoint 脚本。
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver __NGINX_RESOLVER__ valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    location /build-info {
        default_type application/json;
        alias /usr/share/nginx/html/build-info.json;
    }

    location /api {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
